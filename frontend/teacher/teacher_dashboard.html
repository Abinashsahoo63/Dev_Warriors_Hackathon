<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
        }

        .navbar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .logout-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background: #ff4b5c;
            color: white;
        }

        .dashboard {
            padding: 40px;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .card {
            width: 220px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: 0.4s;
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: rotateY(10deg) rotateX(5deg) scale(1.05);
            background: rgba(255,255,255,0.2);
        }

        .red {
            background: rgba(255, 0, 0, 0.3);
        }

        table {
            width: 80%;
            margin: 50px auto;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
        }

        th {
            background: rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(255,255,255,0.1);
        }

        button {
            padding: 6px 15px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            background: #00c6ff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Add in your Teacher Dashboard somewhere -->
<button onclick="startStudentExam()">Start Exam for Students</button>

<div class="navbar">
    <h2>Welcome, <span id="teacherName"></span></h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="dashboard">

    <h1>Teacher Dashboard</h1>

    <div class="stats">
        <div class="card">Total Students: 50</div>
        <div class="card">Present: 45</div>
        <div class="card">Absent: 5</div>
        <div class="card red">Disqualified: 2</div>
    </div>

    <h2>Live Monitoring</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Warnings</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>Active</td>
            <td>2</td>
            <td><button>View</button></td>
        </tr>
    </table>

</div>

<script>
document.getElementById("teacherName").innerText =
    localStorage.getItem("teacherName");

function logout(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
