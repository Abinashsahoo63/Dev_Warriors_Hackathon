<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>Teacher Dashboard</h1>

    <div class="stats">
        <div class="card">Total Students: 50</div>
        <div class="card">Present: 45</div>
        <div class="card">Absent: 5</div>
        <div class="card red">Disqualified: 2</div>
    </div>

    <h2>Live Monitoring</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Warnings</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>Active</td>
            <td>2</td>
            <td><button>View</button></td>
        </tr>
    </table>

</div>

</body>
</html>
